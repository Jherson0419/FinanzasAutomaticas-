# Codemagic CI/CD — build de iOS (Fase 22, C.3).
#
# Este archivo define QUÉ se compila y CÓMO se verifica antes de firmar.
# Lo que NO define a propósito (a rellenar a mano en el panel de Codemagic,
# nunca en este repo): certificados de firma, perfiles de aprovisionamiento,
# la API key de App Store Connect, ni ningún secreto. Ver la lista al final
# de este archivo con los pasos manuales pendientes.

workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Fase 89c: versión EXACTA, la misma del equipo de desarrollo
      # (Dart 3.11.5). `stable` usaba una más nueva (3.47+) que marca
      # material.dart como obsoleto. Al subirla, hacerlo a propósito y
      # en los tres workflows.
      flutter: 3.41.9
      # Fase 89c: Xcode EXACTO (lista oficial docs.codemagic.io,
      # specs-macos/xcode-26-4: "26.4.1 (17E202)"), en vez de `latest`,
      # que cambia solo. Compila con el SDK de iOS 26 que exige App Store.
      xcode: 26.4.1
      cocoapods: default
      groups:
        # Grupo de variables a crear en Codemagic → Teams → <tu equipo> →
        # Environment variables (nombre exacto del grupo: "appstore_credentials").
        # Variables esperadas dentro del grupo, todas configuradas ahí, NUNCA
        # en este archivo ni en el repo:
        #   APP_STORE_CONNECT_ISSUER_ID   — App Store Connect → Users and Access → Integrations → API Keys
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_PRIVATE_KEY — contenido del archivo .p8 de la API key
        #   CERTIFICATE_PRIVATE_KEY       — si se firma con un certificado propio en vez de que
        #                                    Codemagic lo genere automáticamente
        - appstore_credentials
      vars:
        # Bundle identifier real, tomado de ios/Runner.xcodeproj/project.pbxproj
        # (Fase 27: com.finzoapp.movil, registrado en Apple Developer/App Store
        # Connect — antes era com.finanzasautomaticas.finanzasAutomaticas).
        BUNDLE_ID: "com.finzoapp.movil"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    # Fase 89: SOLO se publica al crear una etiqueta v* (p. ej. v1.1.0) o
    # al iniciarlo a mano desde Codemagic ("Start new build" → ios-release).
    # Un push a cualquier rama, incluida main, ya NO publica.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter pub get

      # Puerta de calidad: si esto falla, el workflow se detiene aquí y
      # nunca llega a firmar ni subir un build roto.
      - name: flutter analyze
        script: flutter analyze

      - name: flutter test
        script: flutter test

      # Fase 49/50: desde que la Fase 37 reemplazó `flutter build ipa` por
      # `xcode-project build-ipa` (herramienta nativa de Codemagic que llama
      # a `xcodebuild` directo), el pipeline dejó de pasar por
      # `buildXcodeProject()` de Flutter — y con eso, por TODAS sus
      # migraciones de `project.pbxproj`, incluida
      # `SwiftPackageManagerIntegrationMigration` (la que agrega la
      # referencia al paquete local `FlutterGeneratedPluginSwiftPackage`).
      # Todos los plugins de iOS de este proyecto son Swift Packages —
      # Flutter mismo confirmó en el log de la Fase 49 que el `Podfile` ya
      # no tiene ninguna razón de existir y que la migración a Swift
      # Package Manager debía hacerse manualmente. Fase 50: se retira
      # CocoaPods del todo — `pod deintegrate` limpia cualquier integración
      # vieja del `.xcodeproj` (referencias a Pods.xcodeproj, build phases,
      # etc.), y `flutter build ios --config-only` corre la migración de
      # SPM sin llegar a archivar (con `--no-codesign` porque este paso va
      # antes de "Configurar firma de código" en el pipeline).
      - name: Integrar Swift Package Manager
        script: |
          set -e
          cd ios
          pod deintegrate || true
          cd ..
          flutter build ios --config-only --release --no-codesign
          echo "--- ¿project.pbxproj quedó con la referencia a FlutterGeneratedPluginSwiftPackage? ---"
          grep -c "FlutterGeneratedPluginSwiftPackage" ios/Runner.xcodeproj/project.pbxproj || echo "0 — la migración no se aplicó, revisar el log de arriba"

      # Requiere que en Codemagic → App settings → iOS code signing esté
      # configurado (automático con la API key de App Store Connect, o
      # manual con certificado + perfil subidos ahí). Sin eso, este paso
      # falla — es exactamente lo que reemplaza no tener macOS localmente.
      - name: Configurar firma de código
        script: |
          set -x
          echo "Bundle ID usado: $BUNDLE_ID"
          keychain initialize

          # Fase 61: cada build de Codemagic corre en una máquina efímera —
          # `certificates create` genera un certificado de distribución
          # NUEVO en cada corrida (aunque use la misma
          # CERTIFICATE_PRIVATE_KEY), y el perfil de aprovisionamiento no
          # siempre queda emparejado con ese certificado recién creado
          # (huérfano, o apuntando a uno anterior) — la causa raíz de
          # "doesn't include signing certificate" en las Fases 40 y 51.
          # Revocar y borrar TODO antes de crear garantiza que cada build
          # arranca sin nada previo con lo que pueda chocar: el par que
          # generan `certificates create`/`fetch-signing-files --create`
          # queda siempre 100% nuevo y consistente entre sí.
          echo "--- Verificando que jq esté disponible ---"
          command -v jq >/dev/null 2>&1 || brew install jq

          echo "--- Revocando certificados de distribución existentes ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION --json | \
            jq -r '.[].id' | while read -r cert_id; do
              echo "Revocando certificado: $cert_id"
              app-store-connect certificates revoke "$cert_id" || true
            done

          echo "--- Eliminando perfiles de App Store existentes para este bundle ---"
          app-store-connect profiles list --json | \
            jq -r --arg bundle "$BUNDLE_ID" '.[] | select(.attributes.bundleId == $bundle) | .id' | \
            while read -r profile_id; do
              echo "Eliminando perfil: $profile_id"
              app-store-connect profiles delete "$profile_id" || true
            done

          echo "--- Certificados de distribución existentes en la cuenta ---"
          app-store-connect certificates list --type IOS_DISTRIBUTION

          echo "--- Intentando crear certificado de distribución ---"
          app-store-connect certificates create --type IOS_DISTRIBUTION --save \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY

          echo "--- Certificados en el keychain tras crear ---"
          keychain list-certificates

          echo "--- Perfiles existentes en la cuenta ---"
          app-store-connect profiles list

          echo "--- Intentando crear/descargar el perfil de App Store ---"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY

          keychain add-certificates
          xcode-project use-profiles

      - name: Compilar el .ipa (release)
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      # `build/ios/ipa/*.ipa` es la misma ruta que ya usa `artifacts:` más
      # abajo — `xcode-project build-ipa` deja ahí el .ipa firmado. Reusa
      # las credenciales de `appstore_credentials` (mismo grupo que ya
      # usa `app-store-connect` en "Configurar firma de código"), sin
      # pedir nada nuevo.
      - name: Publicar en TestFlight
        script: |
          set -e
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Subiendo: $IPA_PATH"
          app-store-connect publish \
            --path "$IPA_PATH" \
            --testflight

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      # Descomentar cuando la app ya exista en App Store Connect (ver
      # pendientes abajo) y quieras que cada build suba automáticamente a
      # TestFlight. Hasta entonces, deja el .ipa como artefacto y súbelo a
      # mano la primera vez.
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      email:
        recipients:
          - jhersonvasquezcastillo@gmail.com
        notify:
          success: true
          failure: true

  # Fase 89: validación de iOS en cada push a una rama que NO es main.
  # Sin firma, sin certificados, sin variables secretas y sin publicar:
  # solo comprueba que el proyecto compila.
  ios-validar:
    name: iOS Validar (sin firma)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Fase 89c: versión EXACTA, la misma del equipo de desarrollo
      # (Dart 3.11.5). `stable` usaba una más nueva (3.47+) que marca
      # material.dart como obsoleto. Al subirla, hacerlo a propósito y
      # en los tres workflows.
      flutter: 3.41.9
      # Fase 89c: Xcode EXACTO (lista oficial docs.codemagic.io,
      # specs-macos/xcode-26-4: "26.4.1 (17E202)"), en vez de `latest`,
      # que cambia solo. Compila con el SDK de iOS 26 que exige App Store.
      xcode: 26.4.1
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
        - pattern: main
          include: false
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze
      - name: flutter test
        script: flutter test
      # Mismo motivo que en ios-release (Fase 50): el proyecto usa Swift
      # Package Manager, no CocoaPods.
      - name: Quitar integración de CocoaPods
        script: |
          cd ios
          pod deintegrate || true
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign

  # Fase 89: validación de Android (cambios de build de la Fase 87:
  # desugaring, permisos y receptores de notificaciones locales). Sin firma
  # y sin publicar.
  android-validar:
    name: Android Validar (debug)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      # Fase 89c: versión EXACTA, la misma del equipo de desarrollo
      # (Dart 3.11.5). `stable` usaba una más nueva (3.47+) que marca
      # material.dart como obsoleto. Al subirla, hacerlo a propósito y
      # en los tres workflows.
      flutter: 3.41.9
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: true
        - pattern: main
          include: false
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter pub get
      - name: flutter analyze
        script: flutter analyze
      - name: flutter test
        script: flutter test
      # `android/app/google-services.json` no está en el repositorio (el
      # plugin com.google.gms.google-services lo exige para compilar). Si
      # existe la variable GOOGLE_SERVICES_JSON (contenido en base64, en un
      # grupo de variables de Codemagic), se usa; si no, se escribe un
      # archivo de RELLENO solo para compilar en debug: con él la app
      # compila pero el push de Firebase no funciona. Nunca se publica.
      - name: google-services.json
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "finzo-ci-relleno",
              "storage_bucket": "finzo-ci-relleno.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.finzoapp.movil" }
                },
                "api_key": [ { "current_key": "relleno-solo-ci" } ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi
      - name: Compilar APK debug
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

# ─────────────────────────────────────────────────────────────────────────
# Pendientes manuales antes de que este workflow pueda correr de verdad
# (ninguno se puede hacer desde este repo ni desde este entorno sin macOS):
#
# 1. Crear la app en App Store Connect (bundle id com.finzoapp.movil), si
#    todavía no existe.
# 2. Generar una API key de App Store Connect (Users and Access →
#    Integrations → App Store Connect API → +) con rol "App Manager" o
#    superior, y guardar Issuer ID, Key ID y el archivo .p8 en el grupo de
#    variables "appstore_credentials" de Codemagic (no en este repo).
# 3. En Codemagic → tu app → Code signing identities, dejar que Codemagic
#    genere el certificado de distribución y el perfil de aprovisionamiento
#    automáticamente usando esa misma API key (opción recomendada), o subir
#    los tuyos si ya los tienes.
# 4. Conectar el repo de git a Codemagic (Codemagic → Add application) para
#    que el trigger `push` de este archivo tenga algo que escuchar.
# 5. Confirmar `lib/config/supabase_config.dart` contra el proyecto de
#    Supabase real antes del primer build de producción — ver
#    INFORME_PROYECTO.md sección 8 sobre el esquema de columnas sin
#    verificar contra `schema_finanzas_v3.sql`.
